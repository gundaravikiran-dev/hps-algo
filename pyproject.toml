[project]
name = "HPS-Algo"
version = "0.1.0"
description = "Architecture-first Zerodha Kite algo trading framework"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "kiteconnect>=5.2.0",
    "pandas>=2.2.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "PyYAML>=6.0.1",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
hps-algo = "hps_algo.cli:main"
hps-algo-ui = "hps_algo.ui.app:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]
package = [
    "pyinstaller>=6.19.0",
    "pyobjc-framework-Cocoa>=11.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
hps_algo = ["ui/static/*", "ui/templates/*"]
